name: Build and test

on:
  push:
    branches:
    - main
    - dev
  pull_request:

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0 # for MinVer
        persist-credentials: false
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5.4.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          global.json
          **/Directory.Packages.props
          NuGet.config
    - name: Build
      run: dotnet build Toolkit.Wpf.DependencyProperties.slnx --configuration Release -p:TreatWarningsAsErrors=true -p:EnforcePublicApiDocumentation=true /nologo
    - name: Run tests
      shell: pwsh
      run: |
        # The test project targets net10.0-windows and is not multi-targeted, so its output path is fixed.
        $testExecutable = "tests/Toolkit.Wpf.DependencyProperties.Tests/bin/Release/net10.0-windows/Toolkit.Wpf.DependencyProperties.Tests.exe"
        if (-not (Test-Path -LiteralPath $testExecutable)) {
          throw "Test executable was not produced: $testExecutable"
        }
        & $testExecutable
        if ($LASTEXITCODE -ne 0) {
          throw "Tests failed with exit code $LASTEXITCODE."
        }
    - name: Upload artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: VolocyNazad.Wpf.DependencyPropertyGenerator
        path: artifacts/*
